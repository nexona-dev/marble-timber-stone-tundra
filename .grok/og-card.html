<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <style>
    @font-face {
      font-family: "Instrument Serif";
      src: url("fonts/instrument-serif.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Instrument Sans";
      src: url("fonts/instrument-sans-500.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0c1220;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      background:
        radial-gradient(ellipse 68% 52% at 50% 44%, rgba(18, 185, 129, 0.16), transparent 62%),
        radial-gradient(ellipse 36% 28% at 82% 86%, rgba(228, 177, 90, 0.10), transparent 70%),
        linear-gradient(180deg, #10182a 0%, #0c1220 46%, #090e18 100%);
      color: #f3f6fb;
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(243, 246, 251, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(243, 246, 251, 0.035) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 46%, #000 20%, transparent 75%);
    }
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 46%, transparent 42%, rgba(0, 0, 0, 0.42) 100%);
    }
    .frame {
      position: absolute;
      inset: 28px;
      border: 1px solid rgba(243, 246, 251, 0.12);
      pointer-events: none;
    }
    .frame:before,
    .frame:after,
    .tick-tr,
    .tick-bl {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      border: 1.5px solid rgba(228, 177, 90, 0.9);
    }
    .frame:before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
    .frame:after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }
    .tick-tr { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
    .tick-bl { left: -1px; bottom: -1px; border-right: 0; border-top: 0; }
    .skyline {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1200px;
      height: 188px;
    }
    .lockup {
      position: absolute;
      left: 0;
      right: 0;
      top: 118px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .mark {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 22px;
      margin-bottom: 22px;
    }
    .mark i {
      display: block;
      width: 6px;
    }
    .mark i:nth-child(1) { height: 12px; background: #f3f6fb; }
    .mark i:nth-child(2) { height: 22px; background: #12b981; }
    .mark i:nth-child(3) { height: 16px; background: #e4b15a; }
    h1 {
      margin: 0;
      font-family: "Instrument Serif", "Liberation Serif", serif;
      font-weight: 400;
      font-size: 150px;
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: #f3f6fb;
    }
    .rule {
      width: 72px;
      height: 2px;
      margin: 26px 0 22px;
      background: #12b981;
    }
    p {
      margin: 0;
      font-family: "Instrument Sans", "Liberation Sans", sans-serif;
      font-weight: 500;
      font-size: 26px;
      line-height: 1;
      letter-spacing: 0.01em;
      color: #e4b15a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <svg class="skyline" viewBox="0 0 1200 188" aria-hidden="true">
      <g fill="#10182a">

        <rect x="430" y="100" width="30" height="88"/>

        <polygon points="48,188 48,78 72,78 72,52 98,52 98,188"/>
        <rect x="112" y="96" width="40" height="92"/>
        <polygon points="168,188 168,70 196,70 196,44 214,44 214,188"/>
        <rect x="236" y="110" width="58" height="78"/>
        <polygon points="310,188 310,64 338,64 338,36 368,36 368,188"/>
        <rect x="388" y="102" width="34" height="86"/>
        <rect x="436" y="124" width="72" height="64"/>
        <polygon points="760,188 760,58 792,58 792,30 826,30 826,188"/>

    </svg>
    <div class="vignette"></div>
    <div class="lockup">
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1 id="title">SellBizOnline</h1>
      <div class="rule"></div>
      <p id="tag">0% commission. Deal direct.</p>
    </div>
    <div class="frame"><i class="tick-tr"></i><i class="tick-bl"></i></div>
  </div>
</body>
</html>
